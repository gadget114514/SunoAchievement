<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; font-src 'self'" />
<title>Suno Achievement Snapshot</title>
<link rel="stylesheet" href="css/snapshot.css" />
</head>
<body>

<svg class="svg-defs" aria-hidden="true">
  <symbol id="ic-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="ic-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></symbol>
  <symbol id="ic-heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></symbol>
  <symbol id="ic-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></symbol>
  <symbol id="ic-star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="ic-shuffle" viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="ic-gem" viewBox="0 0 24 24"><polygon points="6 3 18 3 22 9 12 21 2 9 6 3"/><polyline points="2 9 22 9"/><polyline points="12 21 8 9"/><polyline points="12 21 16 9"/></symbol>
  <symbol id="ic-comment" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="ic-verified" viewBox="0 0 24 24"><path d="M12 2 14.5 4.5 18 4l1 3.5 3 2-1.5 3.5L21 17l-3.5 1-2 3-3.5-1.5L8.5 21l-2-3L3 17l.5-4L2 9.5l3-2L6 4l3.5.5z"/><polyline points="9 12 11 14 15 9"/></symbol>
</svg>

<div class="snap">
  <header class="snap-head">
    <div class="snap-profile">
      <img id="snap-avatar" class="snap-avatar" alt="" />
      <div class="snap-profile-text">
        <div class="snap-name-row">
          <h1 id="snap-name"></h1>
          <svg id="snap-verified" class="icon snap-verified" hidden><use href="#ic-verified"></use></svg>
          <span id="snap-handle" class="snap-handle"></span>
        </div>
        <p id="snap-desc" class="snap-desc"></p>
      </div>
    </div>
    <div id="snap-stats" class="snap-stats"></div>
    <div class="snap-completion">
      <div id="snap-ring" class="snap-ring"><div class="snap-ring-inner"><span id="snap-percent">0%</span></div></div>
      <div class="snap-completion-text">
        <span id="snap-summary" class="snap-summary"></span>
        <span class="snap-brand">Suno Achievement</span>
      </div>
    </div>
  </header>

  <main id="snap-grid" class="snap-grid"></main>

  <footer class="snap-foot">
    <span id="snap-generated"></span>
    <span class="snap-brand-foot">unofficial</span>
  </footer>
</div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/format.js"></script>
<script src="js/achievements.js"></script>
<script src="js/snapshot.js"></script>
</body>
</html>
